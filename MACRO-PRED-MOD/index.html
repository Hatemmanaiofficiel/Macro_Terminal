<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACRO_TERMINAL_12V: SOVEREIGN_FREEDOM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@300;500;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="nexus-theme">

    <!-- TOP SOVEREIGN PULSE -->
    <div class="ticker-tape top-pulse">
        <div class="ticker-content" id="market-track">
            <!-- Institutional Real-World Benchmarks (GOLD, SLVR, SPX) -->
        </div>
    </div>

    <div class="master-layout">

        <!-- LEFT: INSTRUMENT COMMANDER (12V) -->
        <aside class="panel left-sidebar">
            <div class="panel-header">
                <span class="panel-title">INSTRUMENT_COMMANDER_12V</span>
                <span id="sys-status" class="status-pill">NOMINAL</span>
            </div>

            <div class="control-module">
                <span class="wp-sh">MACRO_VECTOR_RIBBON</span>
                <div class="vector-matrix" id="vector-matrix">
                    <button class="v-btn active" data-v="gdp">GDP_GROWTH</button>
                    <button class="v-btn" data-v="inflation">CONSUMER_INF</button>
                    <button class="v-btn" data-v="unemployment">LABOR_INDX</button>
                    <button class="v-btn" data-v="debt">DEBT_GDP_RATIO</button>
                    <button class="v-btn" data-v="trade">TRADE_VOLUME</button>
                </div>
            </div>

            <div class="control-module">
                <span class="wp-sh">SOVEREIGN_REGIONS</span>
                <div class="region-grid">
                    <div class="region-sq nav-btn" data-c="EU">EU</div>
                    <div class="region-sq nav-btn" data-c="AS">AS</div>
                    <div class="region-sq nav-btn" data-c="AM">AM</div>
                    <div class="region-sq nav-btn" data-c="AF">AF</div>
                    <div class="region-sq nav-btn" data-c="OC">OC</div>
                    <div class="region-sq nav-btn" data-c="WORLD">GLO</div>
                </div>
                <button id="reset-globe-btn" class="elite-btn">INITIALIZE_MASTER_RESET</button>
            </div>

            <div class="control-module" id="country-refinement"
                style="display: none; border-left: 2px solid var(--accent-yellow); background: rgba(255,255,0,0.02);">
                <span class="wp-sh" style="margin-top:0;">SOVEREIGN_REFINEMENT</span>
                <div class="selector-grid" id="refinement-grid"></div>
            </div>

            <div class="control-module flex-grow">
                <span class="wp-sh">INSTITUTIONAL_EVENT_STREAM</span>
                <div class="event-log" id="event-log"></div>
            </div>

            <div class="footer-meta">
                <div id="sys-clock">00:00:00 UTC</div>
                <div>TERMINAL_S_12_FREEDOM</div>
            </div>
        </aside>

        <!-- CENTER: GEOSPATIAL FREEDOM -->
        <main class="visual-nexus">
            <div class="panel map-view">
                <div class="overlay-tags">
                    <span id="country-tag">GLOBAL_MARKET</span>
                    <span id="view-mode-tag">[STATE: NEUTRAL]</span>
                </div>
                <div id="map"></div>
            </div>

            <div class="panel chart-view">
                <div class="panel-header">
                    <span class="panel-title">QUANTUM_PROJECTION_SOLVER_12</span>
                </div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
        </main>

        <!-- RIGHT: 3-PAGE ZERO-GAP DOSSIER -->
        <aside class="panel report-view dossier-panel">
            <div class="dossier-controls">
                <div class="dossier-tabs">
                    <button class="d-tab active" data-page="1">PAGE_01:PRESENCE</button>
                    <button class="d-tab" data-page="2">PAGE_02:SOLVER</button>
                    <button class="d-tab" data-page="3">PAGE_03:ADVISORY</button>
                </div>
                <button id="print-btn" class="icon-btn">PRNT</button>
            </div>

            <div id="report-output" class="dossier-content">
                <!-- Zero-Gap Institutional Reporting -->
            </div>

            <div class="panel-header radar-header">
                <span class="panel-title">STRUCTURAL_RADAR_SYNTH</span>
            </div>
            <div class="radar-container">
                <canvas id="radarChart"></canvas>
            </div>

            <div class="matrix-module">
                <span class="wp-sh">CORRELATION_MATRIX_12V</span>
                <div class="matrix-grid" id="matrix-grid"></div>
            </div>
        </aside>

    </div>

    <!-- BOTTOM TICKER (NEXUS_PULSE) -->
    <div class="ticker-tape bottom-pulse">
        <div class="ticker-content" id="macro-track">
            <!-- Live Linked Vector Pulse -->
        </div>
    </div>

    <!-- HIDDEN PRINT HUB ( Institutional Research Engine ) -->
    <div id="print-report-container" class="print-only"></div>

    <script src="js/api.js"></script>
    <script src="js/models.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
